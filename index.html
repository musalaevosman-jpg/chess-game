<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы с Ботом — Проект Османа</title>
    <!-- Подключаем проверенную библиотеку правил шахмат -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #e94560; }
        #status {
            font-size: 18px;
            margin-bottom: 15px;
            padding: 8px 16px;
            background: #16213e;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #0f3460;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            user-select: none;
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            position: relative;
        }
        .light { background-color: #f0d9b5; color: #000; }
        .dark { background-color: #b58863; color: #000; }
        .selected { background-color: #7b61ff !important; }
        .valid-move::after {
            content: '';
            width: 18px;
            height: 18px;
            background-color: rgba(0, 255, 100, 0.6);
            border-radius: 50%;
            position: absolute;
        }
        button {
            margin-top: 20px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #ff2e4c; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>Шахматы против Бота</h1>
    <div id="status">Твой ход (Белые)</div>
    <div id="board"></div>
    <button onclick="resetGame()">Начать заново</button>

    <script>
        const game = new Chess();
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        let selectedSquare = null;
        let validMoves = [];

        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

        function renderBoard() {
            boardEl.innerHTML = '';
            const board = game.board();

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareName = String.fromCharCode(97 + col) + (8 - row);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;

                    if (selectedSquare === squareName) {
                        squareDiv.classList.add('selected');
                    }
                    if (validMoves.some(m => m.to === squareName)) {
                        squareDiv.classList.add('valid-move');
                    }

                    const piece = board[row][col];
                    if (piece) {
                        const symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        squareDiv.textContent = pieceSymbols[symbolKey];
                    }

                    squareDiv.onclick = () => onSquareClick(squareName);
                    boardEl.appendChild(squareDiv);
                }
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (game.game_over() || game.turn() !== 'w') return;

            const move = validMoves.find(m => m.to === square);
            if (move) {
                game.move({ from: selectedSquare, to: square, promotion: 'q' });
                selectedSquare = null;
                validMoves = [];
                renderBoard();

                if (!game.game_over()) {
                    setTimeout(makeBotMove, 350);
                }
                return;
            }

            const piece = game.get(square);
            if (piece && piece.color === 'w') {
                selectedSquare = square;
                validMoves = game.moves({ square: square, verbose: true });
            } else {
                selectedSquare = null;
                validMoves = [];
            }
            renderBoard();
        }

        function evaluateBoard() {
            let score = 0;
            const board = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p) {
                        const val = pieceValues[p.type];
                        score += p.color === 'b' ? val : -val;
                    }
                }
            }
            return score;
        }

        function makeBotMove() {
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let bestMove = null;
            let bestScore = -99999;

            // Бот просчитывает самый выгодный ход
            for (const move of moves) {
                game.move(move);
                // Проверяем ответ игрока на 1 ход вперед
                const playerMoves = game.moves({ verbose: true });
                let worstReplyScore = 99999;

                if (playerMoves.length === 0) {
                    worstReplyScore = game.in_checkmate() ? 10000 : 0;
                } else {
                    for (const pMove of playerMoves) {
                        game.move(pMove);
                        const score = evaluateBoard();
                        if (score < worstReplyScore) worstReplyScore = score;
                        game.undo();
                    }
                }
                game.undo();

                // Добавляем небольшую случайность среди равных ходов
                const finalScore = worstReplyScore + (Math.random() * 2);
                if (finalScore > bestScore) {
                    bestScore = finalScore;
                    bestMove = move;
                }
            }

            game.move(bestMove || moves[0]);
            renderBoard();
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                statusEl.textContent = game.turn() === 'w' ? 'Мат! Победил Бот.' : 'Мат! Ты победил!';
            } else if (game.in_draw()) {
                statusEl.textContent = 'Ничья!';
            } else {
                const turnText = game.turn() === 'w' ? 'Твой ход (Белые)' : 'Бот думает...';
                const checkText = game.in_check() ? ' — ШАХ!' : '';
                statusEl.textContent = turnText + checkText;
            }
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            validMoves = [];
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
